
{% load humanize %}

<div class="col-12">
    <div class="card-horizontal-product border-bottom rounded-0">

        <div class="card-horizontal-product-thumb">
            <a href="{{ product.get_absolute_url }}">
                <img src="{{ product.images.first.image.url }}" alt="">
            </a>
        </div>

        <div class="card-horizontal-product-content">

            <div class="card-horizontal-product-title">
                <a href="{{ product.get_absolute_url }}">
                    <h3>{{ product.name_fa }}</h3>
                </a>
            </div>

            <div class="rating-stars">
            </div>

            <div class="card-horizontal-product-price">

                {% if product.discount and product.discounted_price < product.price %}

                    <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">

                        <del style="color:#999; font-size:13px;">
                            {{ product.price|intcomma }} تومان
                        </del>

                        <span style="color:#6ec3f9; font-weight:bold;">
                            {{ product.discounted_price|intcomma }} تومان
                        </span>

                        <span style="color:#6ec3f9; font-size:13px;">
                            {{ product.discount }}٪ تخفیف
                        </span>

                    </div>

                {% else %}

                    <span>
                        {{ product.price|intcomma }} تومان
                    </span>

                {% endif %}

            </div>

            <div class="card-horizontal-product-buttons">
                <a href="{{ product.get_absolute_url }}"
                   class="btn btn-outline-info"
                   style="border:1px solid #6ec3f9; color:#6ec3f9;">
                    جزئیات محصول
                </a>
            </div>

        </div>
    </div>
</div>
